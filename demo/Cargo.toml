[package]
name = "egui_oklch_color_picker_demo"
edition = "2024"

[dependencies]
egui_oklch_color_picker = { path = "../egui_oklch_color_picker", features = [
    "serde",
] }

eframe = { version = "0.36", features = ["persistence"] }
serde = { version = "1", features = ["derive"] }
log = "0.4.33"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "Window",
    "Document",
    "HtmlCanvasElement",
] }
